<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">X-Learner Framework</title>
  <desc id="desc">Diagram showing the X-learner uplift modeling workflow from data split through outcome models, imputed treatment effects, effect models, propensity weighting, and final benefit score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fff4"/>
      <stop offset="1" stop-color="#efffe8"/>
    </linearGradient>
    <linearGradient id="darkHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005b17"/>
      <stop offset="1" stop-color="#008b24"/>
    </linearGradient>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00a51f"/>
      <stop offset="1" stop-color="#a8ef38"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ffd7"/>
      <stop offset="1" stop-color="#bdf5a0"/>
    </linearGradient>
    <linearGradient id="darkBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00651a"/>
      <stop offset="1" stop-color="#18a83a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#005b17" flood-opacity="0.20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff2d2d"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #fff; }
      .stepText { font: 700 16px Arial, Helvetica, sans-serif; fill: #061a05; }
      .boxTitle { font: 700 16px Arial, Helvetica, sans-serif; fill: #071807; }
      .boxText { font: 400 13px Arial, Helvetica, sans-serif; fill: #222; }
      .smallText { font: 400 12px Arial, Helvetica, sans-serif; fill: #333; }
      .tinyText { font: 700 11px Arial, Helvetica, sans-serif; fill: #ff2d2d; }
      .darkText { font: 700 17px Arial, Helvetica, sans-serif; fill: #fff; }
      .darkSub { font: 400 12px Arial, Helvetica, sans-serif; fill: #eaffdf; }
      .label { font: 700 14px Arial, Helvetica, sans-serif; fill: #061a05; }
      .formula { font: 700 15px Arial, Helvetica, sans-serif; fill: #061a05; }
      .outline { stroke: #00a51f; stroke-width: 3; fill: #fff; }
      .dash { stroke: #ff2d2d; stroke-width: 2; stroke-dasharray: 7 5; fill: #fff; }
      .line { stroke: #111; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .redLine { stroke: #ff2d2d; stroke-width: 2; fill: none; marker-end: url(#redArrow); }
      .thinLine { stroke: #111; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .greenDot { fill: #00ad23; }
      .limeDot { fill: #a8ef38; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="#004b14"/>
  <rect x="0" y="0" width="1200" height="60" fill="url(#darkHeader)"/>
  <text x="50" y="39" class="title">X-Learner Framework</text>

  <rect x="10" y="63" width="1180" height="585" rx="58" fill="url(#bg)" stroke="#a8ef38" stroke-width="4" filter="url(#shadow)"/>

  <!-- Step labels -->
  <rect x="52" y="93" width="125" height="43" rx="8" fill="url(#step)"/>
  <text x="73" y="120" class="stepText">1. Data Split</text>

  <rect x="243" y="93" width="125" height="43" rx="8" fill="url(#step)"/>
  <text x="265" y="120" class="stepText">2. Split Rows</text>

  <rect x="448" y="93" width="142" height="43" rx="8" fill="url(#step)"/>
  <text x="464" y="112" class="stepText">3. Train outcome</text>
  <text x="489" y="130" class="stepText">models</text>

  <rect x="650" y="93" width="146" height="43" rx="8" fill="url(#step)"/>
  <text x="666" y="112" class="stepText">4. Impute effect</text>
  <text x="696" y="130" class="stepText">targets</text>

  <rect x="844" y="93" width="151" height="43" rx="8" fill="url(#step)"/>
  <text x="858" y="112" class="stepText">5. Train effect</text>
  <text x="895" y="130" class="stepText">models</text>

  <rect x="1030" y="93" width="120" height="43" rx="8" fill="url(#step)"/>
  <text x="1044" y="112" class="stepText">6. Score</text>
  <text x="1043" y="130" class="stepText">Benefit</text>

  <!-- Data boxes -->
  <rect x="25" y="200" width="177" height="185" rx="14" class="outline"/>
  <text x="65" y="244" class="boxTitle">Full Dataset</text>
  <text x="62" y="270" class="boxText">1000 total rows</text>
  <g transform="translate(43 292)">
    <circle cx="0" cy="0" r="4" class="greenDot"/><circle cx="14" cy="0" r="4" class="greenDot"/><circle cx="28" cy="0" r="4" class="greenDot"/><circle cx="42" cy="0" r="4" class="greenDot"/><circle cx="56" cy="0" r="4" class="limeDot"/><circle cx="70" cy="0" r="4" class="limeDot"/><circle cx="84" cy="0" r="4" class="limeDot"/><circle cx="98" cy="0" r="4" class="limeDot"/><circle cx="112" cy="0" r="4" class="limeDot"/><circle cx="126" cy="0" r="4" class="limeDot"/>
    <circle cx="0" cy="14" r="4" class="greenDot"/><circle cx="14" cy="14" r="4" class="greenDot"/><circle cx="28" cy="14" r="4" class="greenDot"/><circle cx="42" cy="14" r="4" class="greenDot"/><circle cx="56" cy="14" r="4" class="limeDot"/><circle cx="70" cy="14" r="4" class="limeDot"/><circle cx="84" cy="14" r="4" class="limeDot"/><circle cx="98" cy="14" r="4" class="limeDot"/><circle cx="112" cy="14" r="4" class="limeDot"/><circle cx="126" cy="14" r="4" class="limeDot"/>
    <circle cx="0" cy="28" r="4" class="greenDot"/><circle cx="14" cy="28" r="4" class="greenDot"/><circle cx="28" cy="28" r="4" class="greenDot"/><circle cx="42" cy="28" r="4" class="greenDot"/><circle cx="56" cy="28" r="4" class="limeDot"/><circle cx="70" cy="28" r="4" class="limeDot"/><circle cx="84" cy="28" r="4" class="limeDot"/><circle cx="98" cy="28" r="4" class="limeDot"/><circle cx="112" cy="28" r="4" class="limeDot"/><circle cx="126" cy="28" r="4" class="limeDot"/>
    <circle cx="0" cy="42" r="4" class="greenDot"/><circle cx="14" cy="42" r="4" class="greenDot"/><circle cx="28" cy="42" r="4" class="greenDot"/><circle cx="42" cy="42" r="4" class="greenDot"/><circle cx="56" cy="42" r="4" class="limeDot"/><circle cx="70" cy="42" r="4" class="limeDot"/><circle cx="84" cy="42" r="4" class="limeDot"/><circle cx="98" cy="42" r="4" class="limeDot"/><circle cx="112" cy="42" r="4" class="limeDot"/><circle cx="126" cy="42" r="4" class="limeDot"/>
  </g>

  <path d="M 202 292 L 235 292" class="line"/>
  <path d="M 202 292 C 224 292 222 202 250 202" class="thinLine"/>

  <rect x="254" y="172" width="165" height="70" rx="10" class="dash"/>
  <text x="287" y="198" class="boxTitle">Reserve 300 rows</text>
  <text x="289" y="222" class="boxTitle">Test Set only</text>

  <rect x="254" y="284" width="178" height="160" rx="14" class="outline"/>
  <text x="274" y="310" class="boxTitle">Use remaining 700 rows</text>
  <text x="301" y="334" class="boxTitle">Training Data</text>
  <text x="304" y="391" class="boxText">700 total rows</text>
  <path d="M 432 364 L 462 364" class="line"/>

  <rect x="460" y="332" width="78" height="63" rx="9" fill="url(#darkBox)"/>
  <text x="478" y="357" class="darkText">Split</text>
  <text x="477" y="374" class="darkSub">T=0 and T=1</text>

  <!-- Outcome models -->
  <rect x="574" y="246" width="132" height="64" rx="3" fill="url(#model)"/>
  <text x="607" y="273" class="boxTitle">Model A</text>
  <text x="594" y="294" class="boxTitle">Untreated</text>
  <rect x="540" y="263" width="55" height="29" rx="4" fill="#39c52d"/>
  <text x="555" y="283" class="label">T=0</text>
  <path d="M 538 364 C 558 364 548 279 574 279" class="thinLine"/>

  <rect x="574" y="390" width="132" height="64" rx="3" fill="url(#model)"/>
  <text x="607" y="417" class="boxTitle">Model B</text>
  <text x="606" y="438" class="boxTitle">Treated</text>
  <rect x="540" y="407" width="55" height="29" rx="4" fill="#a8ef38"/>
  <text x="555" y="427" class="label">T=1</text>
  <path d="M 538 364 C 558 364 548 422 574 422" class="thinLine"/>

  <!-- Test set note -->
  <rect x="742" y="158" width="176" height="82" rx="10" class="dash"/>
  <text x="780" y="183" class="boxTitle">Held-out Test Set</text>
  <text x="799" y="207" class="boxTitle">300 rows</text>
  <text x="773" y="227" class="boxText">Never used for training</text>
  <path d="M 830 240 L 830 305" class="redLine"/>
  <text x="843" y="279" class="tinyText">test rows only</text>

  <!-- Imputed effects -->
  <rect x="735" y="270" width="162" height="73" rx="10" fill="url(#darkBox)" filter="url(#shadow)"/>
  <text x="766" y="296" class="darkText">Impute effects</text>
  <text x="756" y="316" class="darkSub">for training rows using</text>
  <text x="756" y="332" class="darkSub">opposite outcome model</text>

  <path d="M 706 279 L 735 297" class="thinLine"/>
  <path d="M 706 422 L 735 318" class="thinLine"/>

  <rect x="720" y="372" width="194" height="58" rx="6" fill="#eaffdf" stroke="#a8ef38"/>
  <text x="735" y="394" class="formula">Treated rows: Y - mu0(X)</text>
  <text x="735" y="415" class="formula">Control rows: mu1(X) - Y</text>
  <path d="M 816 343 L 816 372" class="line"/>

  <!-- Effect models -->
  <rect x="952" y="250" width="132" height="64" rx="3" fill="url(#model)"/>
  <text x="980" y="276" class="boxTitle">Effect Model</text>
  <text x="982" y="297" class="boxTitle">for Treated</text>
  <path d="M 897 297 L 952 282" class="thinLine"/>

  <rect x="952" y="394" width="132" height="64" rx="3" fill="url(#model)"/>
  <text x="980" y="420" class="boxTitle">Effect Model</text>
  <text x="984" y="441" class="boxTitle">for Control</text>
  <path d="M 897 318 L 952 426" class="thinLine"/>

  <!-- Score -->
  <rect x="1012" y="500" width="140" height="82" rx="6" fill="#a8ef38"/>
  <text x="1028" y="526" class="formula">Blend effects by</text>
  <text x="1028" y="546" class="formula">propensity score</text>
  <text x="1035" y="570" class="formula">Final benefit</text>
  <path d="M 1018 314 C 1074 354 1090 440 1082 500" class="thinLine"/>
  <path d="M 1018 458 C 1078 470 1088 486 1082 500" class="thinLine"/>

  <rect x="1014" y="182" width="135" height="62" rx="6" fill="#d8ffc7"/>
  <text x="1031" y="207" class="boxTitle">Propensity</text>
  <text x="1024" y="228" class="boxTitle">P(T=1 | X)</text>
  <path d="M 1082 244 L 1082 500" class="thinLine"/>

  <!-- Legend -->
  <circle cx="42" cy="550" r="8" class="limeDot"/>
  <text x="58" y="555" class="smallText">Treated datapoints (receives program)</text>
  <circle cx="42" cy="580" r="8" class="greenDot"/>
  <text x="58" y="585" class="smallText">Untreated datapoints (doesn't receive program)</text>

  <rect x="420" y="532" width="390" height="66" rx="10" fill="#fff" stroke="#a8ef38" stroke-width="2"/>
  <text x="440" y="556" class="boxTitle">Why X-learner is different</text>
  <text x="440" y="579" class="boxText">It first estimates missing counterfactual outcomes, then learns treatment-effect models</text>
  <text x="440" y="596" class="boxText">directly before scoring each test member's predicted benefit.</text>
</svg>
