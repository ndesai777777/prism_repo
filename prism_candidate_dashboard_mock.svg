<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#07170f"/>
      <stop offset="55%" stop-color="#020706"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11ff33"/>
      <stop offset="60%" stop-color="#b4ff00"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <style>
      .panel{fill:#020504;stroke:#88f000;stroke-width:1.35;filter:url(#shadow)}
      .panelHot{fill:#061006;stroke:#14ff22;stroke-width:2;filter:url(#glow)}
      .panelPurple{fill:#070508;stroke:#c44cff;stroke-width:1.35;filter:url(#shadow)}
      .title{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#14ff22;letter-spacing:0}
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#f0f6f0}
      .muted{font-family:Arial,Helvetica,sans-serif;fill:#aeb8b0}
      .green{font-family:Arial,Helvetica,sans-serif;fill:#14ff22}
      .lime{font-family:Arial,Helvetica,sans-serif;fill:#8cff00}
      .amber{font-family:Arial,Helvetica,sans-serif;fill:#ffb000}
      .red{font-family:Arial,Helvetica,sans-serif;fill:#ff3b30}
      .purple{font-family:Arial,Helvetica,sans-serif;fill:#dc4cff}
      .h2{font-size:22px;font-weight:800}
      .h3{font-size:17px;font-weight:800}
      .body{font-size:18px}
      .small{font-size:15px}
      .tiny{font-size:13px}
      .line{stroke:#243126;stroke-width:1}
      .axis{stroke:#5c6b5e;stroke-width:1}
      .icon{fill:none;stroke:#8cff00;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .pill{fill:#09200d;stroke:#14ff22;stroke-width:1}
      .badPill{fill:#230707;stroke:#ff3b30;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="8" y="8" width="1584" height="884" rx="10" fill="none" stroke="#82d600" stroke-width="1.3"/>

  <rect class="panel" x="18" y="18" width="1564" height="138" rx="9"/>
  <text class="title" x="52" y="58" font-size="34">PRISM CANDIDATE TARGETING REVIEW</text>
  <text class="muted body" x="52" y="91">Member-level dashboard for deciding whether this candidate should be prioritized for outreach</text>
  <text class="muted small" x="52" y="122">Candidate ID: M-1042  |  Program: Complex Care  |  Model: GLMNet T-Learner  |  Outcome: 90-day ED utilization</text>

  <rect class="panelHot" x="1085" y="32" width="445" height="105" rx="10"/>
  <text class="green h3" x="1116" y="62">OVERALL RECOMMENDATION</text>
  <text class="txt" x="1116" y="101" font-size="38" font-weight="800">TARGET</text>
  <text class="muted small" x="1254" y="84">Confidence</text>
  <text class="green" x="1254" y="112" font-size="26" font-weight="800">High</text>
  <rect x="1365" y="73" width="122" height="17" fill="#123016"/>
  <rect x="1365" y="73" width="98" height="17" fill="#14ff22"/>
  <text class="muted tiny" x="1365" y="113">Clinical review still required</text>

  <rect class="panel" x="18" y="170" width="330" height="320" rx="8"/>
  <text class="green h2" x="58" y="205">CANDIDATE SNAPSHOT</text>
  <path class="icon" d="M35 205c4-18 29-18 33 0M43 181a9 9 0 1 0 18 0"/>
  <text class="muted small" x="45" y="245">Predicted ED risk if treated</text>
  <text class="txt" x="45" y="282" font-size="42" font-weight="800">18%</text>
  <text class="muted small" x="190" y="245">If not targeted</text>
  <text class="txt" x="190" y="282" font-size="42" font-weight="800">31%</text>
  <line class="axis" x1="45" y1="305" x2="315" y2="305"/>
  <text class="green h3" x="45" y="343">Estimated benefit</text>
  <text class="txt" x="45" y="398" font-size="58" font-weight="800">+13 pts</text>
  <text class="muted small" x="45" y="428">Expected reduction in ED event likelihood</text>
  <rect class="pill" x="45" y="448" width="112" height="28" rx="14"/>
  <text class="green tiny" x="101" y="467" text-anchor="middle" font-weight="800">Uplift Decile 1</text>
  <rect class="pill" x="170" y="448" width="118" height="28" rx="14"/>
  <text class="green tiny" x="229" y="467" text-anchor="middle" font-weight="800">Top 10% Benefit</text>

  <rect class="panel" x="366" y="170" width="492" height="320" rx="8"/>
  <text class="green h2" x="410" y="205">TOP CONTRIBUTING FEATURES</text>
  <path class="icon" d="M392 204h-18v-18M374 204l27-27"/>
  <text class="muted small" x="410" y="230">Factors increasing confidence that outreach may help</text>
  <g class="txt small">
    <text x="408" y="275">Recent ED visits last 6 months</text>
    <text class="green" x="802" y="275" text-anchor="end">+0.041</text>
    <text x="408" y="323">Current risk score</text>
    <text class="green" x="802" y="323" text-anchor="end">+0.034</text>
    <text x="408" y="371">Transportation barrier flag</text>
    <text class="green" x="802" y="371" text-anchor="end">+0.022</text>
    <text x="408" y="419">CHF / COPD comorbidity flags</text>
    <text class="green" x="802" y="419" text-anchor="end">+0.016</text>
    <text x="408" y="467">Medication adherence gap</text>
    <text class="green" x="802" y="467" text-anchor="end">+0.011</text>
  </g>
  <g>
    <rect x="635" y="259" width="130" height="18" fill="#103016"/><rect x="635" y="259" width="124" height="18" fill="#14ff22"/>
    <rect x="635" y="307" width="130" height="18" fill="#103016"/><rect x="635" y="307" width="102" height="18" fill="#14ff22"/>
    <rect x="635" y="355" width="130" height="18" fill="#103016"/><rect x="635" y="355" width="67" height="18" fill="#14ff22"/>
    <rect x="635" y="403" width="130" height="18" fill="#103016"/><rect x="635" y="403" width="49" height="18" fill="#14ff22"/>
    <rect x="635" y="451" width="130" height="18" fill="#103016"/><rect x="635" y="451" width="33" height="18" fill="#14ff22"/>
  </g>
  <g class="line">
    <line x1="408" y1="290" x2="820" y2="290"/><line x1="408" y1="338" x2="820" y2="338"/><line x1="408" y1="386" x2="820" y2="386"/><line x1="408" y1="434" x2="820" y2="434"/>
  </g>

  <rect class="panel" x="876" y="170" width="360" height="320" rx="8"/>
  <text class="red h2" x="918" y="205">TOP NEGATIVE CONTRIBUTORS</text>
  <path d="M895 184l-20 20M875 184l20 20" stroke="#ff3b30" stroke-width="2.4" stroke-linecap="round"/>
  <text class="muted small" x="918" y="230">Factors reducing expected targeting value</text>
  <g class="txt small">
    <text x="918" y="278">Stable PCP engagement</text>
    <text class="red" x="1187" y="278" text-anchor="end">-0.018</text>
    <text x="918" y="326">Low recent inpatient use</text>
    <text class="red" x="1187" y="326" text-anchor="end">-0.014</text>
    <text x="918" y="374">Prior program exposure</text>
    <text class="red" x="1187" y="374" text-anchor="end">-0.010</text>
    <text x="918" y="422">No housing instability flag</text>
    <text class="red" x="1187" y="422" text-anchor="end">-0.007</text>
  </g>
  <g>
    <rect x="1035" y="262" width="116" height="17" fill="#301010"/><rect x="1100" y="262" width="51" height="17" fill="#ff3b30"/>
    <rect x="1035" y="310" width="116" height="17" fill="#301010"/><rect x="1112" y="310" width="39" height="17" fill="#ff3b30"/>
    <rect x="1035" y="358" width="116" height="17" fill="#301010"/><rect x="1123" y="358" width="28" height="17" fill="#ff3b30"/>
    <rect x="1035" y="406" width="116" height="17" fill="#301010"/><rect x="1132" y="406" width="19" height="17" fill="#ff3b30"/>
  </g>
  <text class="amber small" x="918" y="463">Net read: positive benefit signals outweigh offsets.</text>

  <rect class="panelPurple" x="1254" y="170" width="328" height="320" rx="8"/>
  <text class="purple h2" x="1296" y="205">LLM RATIONALE</text>
  <path d="M1276 183c12-15 32-3 25 14 14 5 10 28-8 28h-35c-20 0-23-27-5-32-2-15 13-25 23-10z" fill="none" stroke="#dc4cff" stroke-width="2"/>
  <text class="muted small" x="1296" y="231">Generated from model outputs and member profile</text>
  <g class="txt small">
    <circle cx="1282" cy="270" r="10" fill="none" stroke="#14ff22"/><path d="M1277 270l4 5 8-10" stroke="#14ff22" fill="none"/>
    <text x="1302" y="266">Good candidate because ED utilization and</text>
    <text x="1302" y="286">risk score suggest avoidable near-term need.</text>
    <circle cx="1282" cy="328" r="10" fill="none" stroke="#14ff22"/><path d="M1277 328l4 5 8-10" stroke="#14ff22" fill="none"/>
    <text x="1302" y="324">Transportation barrier may be actionable</text>
    <text x="1302" y="344">through care coordination support.</text>
    <circle cx="1282" cy="386" r="10" fill="none" stroke="#ffb000"/><path d="M1276 386h12" stroke="#ffb000"/>
    <text x="1302" y="382">Review prior program contact before assignment</text>
    <text x="1302" y="402">to avoid duplicative outreach.</text>
    <circle cx="1282" cy="444" r="10" fill="none" stroke="#ff3b30"/><path d="M1276 438l12 12M1288 438l-12 12" stroke="#ff3b30"/>
    <text x="1302" y="440">Bad candidate if already stabilized or unable</text>
    <text x="1302" y="460">to engage through the available channel.</text>
  </g>

  <rect class="panel" x="18" y="510" width="520" height="172" rx="8"/>
  <text class="green h2" x="58" y="545">TARGETING DECISION SUMMARY</text>
  <text class="txt body" x="58" y="585">Recommend outreach because the predicted untreated ED risk is materially</text>
  <text class="txt body" x="58" y="612">higher than treated risk, and the strongest drivers map to supportable</text>
  <text class="txt body" x="58" y="639">interventions: care navigation, access support, and medication follow-up.</text>
  <text class="amber small" x="58" y="668">Guardrail: confirm eligibility, recent contact history, and care manager capacity.</text>

  <rect class="panel" x="556" y="510" width="482" height="172" rx="8"/>
  <text class="green h2" x="598" y="545">WHAT WOULD MAKE THIS WEAKER?</text>
  <g class="txt small">
    <circle cx="600" cy="581" r="8" fill="none" stroke="#ffb000"/><text x="620" y="586">Recent successful outreach already resolved the access issue</text>
    <circle cx="600" cy="620" r="8" fill="none" stroke="#ffb000"/><text x="620" y="625">Clinical review finds ED risk is not modifiable by the program</text>
    <circle cx="600" cy="659" r="8" fill="none" stroke="#ffb000"/><text x="620" y="664">Member preference, eligibility, or engagement channel is unavailable</text>
  </g>

  <rect class="panel" x="1056" y="510" width="526" height="172" rx="8"/>
  <text class="green h2" x="1100" y="545">NEXT BEST ACTION</text>
  <rect class="pill" x="1100" y="568" width="158" height="34" rx="17"/>
  <text class="green small" x="1179" y="590" text-anchor="middle" font-weight="800">Assign Outreach</text>
  <rect class="pill" x="1273" y="568" width="118" height="34" rx="17"/>
  <text class="green small" x="1332" y="590" text-anchor="middle" font-weight="800">Care Review</text>
  <rect class="badPill" x="1406" y="568" width="92" height="34" rx="17"/>
  <text class="red small" x="1452" y="590" text-anchor="middle" font-weight="800">Defer</text>
  <text class="txt small" x="1100" y="633">Suggested note: prioritize for care-manager outreach focused on</text>
  <text class="txt small" x="1100" y="656">transportation, medication adherence, and ED diversion planning.</text>

  <rect class="panel" x="18" y="702" width="1564" height="180" rx="8"/>
  <text class="green h2" x="58" y="737">AUDITABLE EXPLANATION TRAIL</text>
  <text class="muted small" x="58" y="766">Every recommendation should show the model evidence, generated narrative, and reviewer override path.</text>
  <g class="txt small">
    <text x="70" y="812">1. Model evidence</text>
    <text class="muted" x="70" y="838">Benefit score +0.13, uplift decile 1, positive drivers exceed negative contributors.</text>
    <text x="455" y="812">2. Generated rationale</text>
    <text class="muted" x="455" y="838">LLM summarizes why the member appears actionable and names reasons to be cautious.</text>
    <text x="860" y="812">3. Human review</text>
    <text class="muted" x="860" y="838">Case team checks eligibility, recent touchpoints, and operational capacity before final assignment.</text>
    <text x="1230" y="812">4. Outcome feedback</text>
    <text class="muted" x="1230" y="838">Track outreach result, ED outcome, and ROI contribution for monitoring.</text>
  </g>
  <line class="line" x1="410" y1="790" x2="410" y2="858"/>
  <line class="line" x1="812" y1="790" x2="812" y2="858"/>
  <line class="line" x1="1186" y1="790" x2="1186" y2="858"/>
</svg>
