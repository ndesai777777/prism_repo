<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="acentraGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BBC2B" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#B4EA54" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#003900" flood-opacity="0.22"/>
    </filter>
    <style>
      text { font-family: Inter, Arial, sans-serif; }
      .title { fill: #FFFFFF; font-size: 58px; font-weight: 800; letter-spacing: 0; }
      .eyebrow { fill: #B4EA54; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .body { fill: #EBFFE1; font-size: 25px; line-height: 1.25; }
      .small { fill: #003900; font-size: 16px; }
      .axis { stroke: #003900; stroke-width: 3; stroke-linecap: round; }
      .grid { stroke: #B2E0A6; stroke-width: 1; opacity: 0.45; }
      .threshold { stroke: #2BBC2B; stroke-width: 2; stroke-dasharray: 10 8; opacity: 0.8; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#016101"/>

  <ellipse cx="1168" cy="812" rx="520" ry="520" fill="url(#acentraGradient)"/>
  <ellipse cx="1168" cy="812" rx="350" ry="350" fill="#016101"/>
  <rect x="1290" y="-110" width="280" height="930" rx="140" fill="#2BBC2B" opacity="0.50" transform="rotate(-27 1430 355)"/>

  <text x="108" y="98" class="eyebrow">03</text>
  <text x="108" y="134" class="eyebrow">TARGETING STRATEGY</text>
  <text x="108" y="220" class="title">Risk vs. Estimated Benefit</text>

  <foreignObject x="112" y="302" width="560" height="125">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Inter, Arial, sans-serif; color: #EBFFE1; font-size: 25px; line-height: 1.28;">
      Highest risk members are not automatically the best uplift targets. PRISM should prioritize the people whose expected outcomes change the most with intervention.
    </div>
  </foreignObject>

  <rect x="112" y="462" width="132" height="38" rx="19" fill="#2BBC2B"/>
  <text x="178" y="487" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">Risk alone</text>
  <rect x="262" y="462" width="194" height="38" rx="19" fill="#B4EA54"/>
  <text x="359" y="487" text-anchor="middle" fill="#016101" font-size="16" font-weight="700">Estimated benefit</text>

  <rect x="108" y="590" width="540" height="260" rx="10" fill="#08720A" opacity="0.86" stroke="#B4EA54" stroke-opacity="0.24" stroke-width="1.5"/>
  <text x="142" y="657" fill="#FFFFFF" font-size="26" font-weight="700">Read the upper half first</text>
  <foreignObject x="142" y="676" width="456" height="108">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Inter, Arial, sans-serif; color: #EBFFE1; font-size: 23px; line-height: 1.26;">
      The strongest outreach group is defined by expected benefit. Some high-risk members may have low modeled change, while moderate-risk members can show stronger uplift potential.
    </div>
  </foreignObject>
  <foreignObject x="142" y="790" width="456" height="62">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Inter, Arial, sans-serif; color: #B4EA54; font-size: 19px; line-height: 1.22; font-weight: 700;">
      Decision rule: rank by benefit within operational constraints, then apply risk and equity safeguards.
    </div>
  </foreignObject>

  <g filter="url(#softShadow)">
    <rect x="730" y="190" width="1068" height="760" rx="14" fill="#FFFFFF" fill-opacity="0.96" stroke="#B4EA54" stroke-opacity="0.55" stroke-width="2"/>
  </g>

  <text x="784" y="262" fill="#003900" font-size="30" font-weight="800">Estimated benefit reveals who is most movable</text>
  <text x="786" y="299" fill="#003900" font-size="18">Illustrative scatterplot: each point represents a member or cohort</text>

  <rect x="826" y="192" width="840" height="193.5" fill="#D3F8C4" opacity="0.55"/>
  <rect x="1397.2" y="385.5" width="268.8" height="236.5" fill="#2BBC2B" opacity="0.10"/>

  <line x1="994" y1="622" x2="994" y2="192" class="grid"/>
  <line x1="1162" y1="622" x2="1162" y2="192" class="grid"/>
  <line x1="1330" y1="622" x2="1330" y2="192" class="grid"/>
  <line x1="1498" y1="622" x2="1498" y2="192" class="grid"/>
  <line x1="826" y1="536" x2="1666" y2="536" class="grid"/>
  <line x1="826" y1="450" x2="1666" y2="450" class="grid"/>
  <line x1="826" y1="364" x2="1666" y2="364" class="grid"/>
  <line x1="826" y1="278" x2="1666" y2="278" class="grid"/>

  <line x1="826" y1="622" x2="826" y2="186" class="axis"/>
  <line x1="826" y1="622" x2="1674" y2="622" class="axis"/>
  <line x1="826" y1="385.5" x2="1666" y2="385.5" class="threshold"/>
  <line x1="1397.2" y1="622" x2="1397.2" y2="192" class="threshold"/>

  <text x="704" y="445" fill="#003900" font-size="18" font-weight="700" transform="rotate(-90 704 445)">Estimated benefit / risk reduction</text>
  <text x="1246" y="696" text-anchor="middle" fill="#003900" font-size="18" font-weight="700">Predicted ED risk without program</text>
  <text x="826" y="648" fill="#003900" font-size="15">Lower risk</text>
  <text x="1666" y="648" text-anchor="end" fill="#003900" font-size="15">Higher risk</text>
  <text x="766" y="184" fill="#003900" font-size="15">Higher benefit</text>
  <text x="768" y="594" fill="#003900" font-size="15">Lower benefit</text>

  <g fill="#B0DAA7" stroke="#2BBC2B" opacity="0.58">
    <circle cx="926.8" cy="527.4" r="9"/><circle cx="977.2" cy="467.2" r="11"/><circle cx="1027.6" cy="497.3" r="8"/>
    <circle cx="1086.4" cy="437.1" r="10"/><circle cx="1162" cy="475.8" r="9"/><circle cx="1237.6" cy="415.6" r="10"/>
    <circle cx="1313.2" cy="450" r="8"/><circle cx="1355.2" cy="398.4" r="10"/><circle cx="1414" cy="424.2" r="8"/>
    <circle cx="1464.8" cy="458.6" r="9"/><circle cx="1531.6" cy="407" r="10"/><circle cx="1590.4" cy="441.4" r="8"/>
  </g>

  <g fill="#B4EA54" stroke="#2BBC2B" stroke-width="2">
    <circle cx="1061.2" cy="312.4" r="13"/><circle cx="1136.8" cy="269.4" r="15"/><circle cx="1237.6" cy="321" r="12"/><circle cx="1304.8" cy="252.2" r="14"/>
  </g>

  <g fill="#FFFFFF" stroke="#2BBC2B" stroke-width="3">
    <circle cx="1439.2" cy="523.1" r="13"/><circle cx="1514.8" cy="501.6" r="15"/><circle cx="1565.2" cy="544.6" r="12"/><circle cx="1615.6" cy="488.7" r="11"/>
  </g>

  <g fill="#2BBC2B" stroke="#003900" stroke-width="2">
    <circle cx="1447.6" cy="303.8" r="15"/><circle cx="1531.6" cy="329.6" r="13"/><circle cx="1582" cy="278" r="14"/>
  </g>

  <rect x="1045" y="332" width="360" height="94" rx="12" fill="#016101" stroke="#B4EA54" stroke-width="2"/>
  <text x="1068" y="374" fill="#FFFFFF" font-size="21" font-weight="800">Prioritize expected benefit</text>
  <text x="1068" y="407" fill="#EBFFE1" font-size="17">Moderate risk can still mean strong uplift.</text>
  <line x1="1150" y1="426" x2="1124" y2="502" stroke="#016101" stroke-width="3"/>

  <rect x="1424" y="462" width="300" height="90" rx="12" fill="#EBFFE1" stroke="#2BBC2B" stroke-width="2"/>
  <text x="1446" y="502" fill="#003900" font-size="21" font-weight="800">High risk, low lift</text>
  <text x="1446" y="533" fill="#003900" font-size="16">May need different programs, not more targeting.</text>
  <line x1="1488" y1="462" x2="1516" y2="398" stroke="#2BBC2B" stroke-width="3"/>

  <rect x="1444" y="194" width="290" height="84" rx="12" fill="#B4EA54" stroke="#2BBC2B" stroke-width="2"/>
  <text x="1466" y="234" fill="#016101" font-size="21" font-weight="800">Strong candidates</text>
  <text x="1466" y="266" fill="#016101" font-size="16">High risk + high expected benefit.</text>
  <line x1="1520" y1="278" x2="1532" y2="324" stroke="#2BBC2B" stroke-width="3"/>

  <circle cx="808" cy="916" r="8" fill="#B4EA54" stroke="#2BBC2B"/>
  <text x="826" y="922" class="small">Higher expected benefit</text>
  <circle cx="1034" cy="916" r="8" fill="#FFFFFF" stroke="#2BBC2B" stroke-width="2"/>
  <text x="1052" y="922" class="small">High risk, lower lift</text>
  <circle cx="1242" cy="916" r="8" fill="#2BBC2B" stroke="#003900"/>
  <text x="1260" y="922" class="small">High risk + high benefit</text>
</svg>
