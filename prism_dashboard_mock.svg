<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#07140f"/>
      <stop offset="52%" stop-color="#030706"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="riskArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff37"/>
      <stop offset="55%" stop-color="#a8ff00"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>
    <style>
      .panel{fill:#020504;stroke:#8cff00;stroke-width:1.4;filter:url(#softShadow)}
      .panel2{fill:#050607;stroke:#b800ff;stroke-width:1.5;filter:url(#softShadow)}
      .title{font-family:Arial, Helvetica, sans-serif;font-weight:800;fill:#14ff22;letter-spacing:0}
      .subtitle{font-family:Arial, Helvetica, sans-serif;fill:#e9f0ea}
      .label{font-family:Arial, Helvetica, sans-serif;fill:#f1f5f1}
      .muted{font-family:Arial, Helvetica, sans-serif;fill:#aeb8b0}
      .green{font-family:Arial, Helvetica, sans-serif;fill:#14ff22}
      .lime{font-family:Arial, Helvetica, sans-serif;fill:#8cff00}
      .amber{font-family:Arial, Helvetica, sans-serif;fill:#ffb000}
      .red{font-family:Arial, Helvetica, sans-serif;fill:#ff2b2b}
      .purple{font-family:Arial, Helvetica, sans-serif;fill:#dc4cff}
      .small{font-size:15px}
      .tiny{font-size:13px}
      .body{font-size:18px}
      .h2{font-size:21px;font-weight:800}
      .h3{font-size:17px;font-weight:800}
      .mono{font-family:Consolas, Monaco, monospace}
      .line{stroke:#214020;stroke-width:1}
      .grid{stroke:#243126;stroke-width:1}
      .dash{stroke:#14ff22;stroke-width:3;stroke-dasharray:8 10;marker-end:url(#arrow)}
      .iconStroke{fill:none;stroke:#8cff00;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#14ff22"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="1584" height="884" rx="10" fill="none" stroke="#82d600" stroke-width="1.3"/>

  <!-- Header workflow -->
  <rect class="panel" x="18" y="18" width="1564" height="238" rx="9"/>
  <text class="title" x="800" y="57" font-size="36" text-anchor="middle">PRISM BENEFIT TARGETING DASHBOARD</text>
  <text class="subtitle" x="800" y="86" font-size="20" text-anchor="middle">Prioritize members by expected reduction in 90-day ED utilization, then explain why they are strong candidates</text>

  <g transform="translate(125 118)">
    <circle cx="0" cy="0" r="38" fill="#061006" stroke="#8cff00" stroke-width="2" filter="url(#greenGlow)"/>
    <path class="iconStroke" d="M-16 12h32M-16 -2h32M-16 -16h32M-16 -16v28M16 -16v28"/>
    <text class="label body" x="0" y="66" text-anchor="middle">Member</text>
    <text class="label body" x="0" y="89" text-anchor="middle">Features</text>
  </g>
  <line class="dash" x1="187" y1="118" x2="304" y2="118"/>
  <g transform="translate(356 118)">
    <circle cx="0" cy="0" r="38" fill="#061006" stroke="#8cff00" stroke-width="2" filter="url(#greenGlow)"/>
    <path class="iconStroke" d="M-17 -12h34v24h-34zM-7 -12v24M7 -12v24"/>
    <text class="label body" x="0" y="66" text-anchor="middle">Treated/Control</text>
    <text class="label body" x="0" y="89" text-anchor="middle">T-Learners</text>
  </g>
  <line class="dash" x1="419" y1="118" x2="536" y2="118"/>
  <g transform="translate(588 118)">
    <circle cx="0" cy="0" r="38" fill="#061006" stroke="#8cff00" stroke-width="2" filter="url(#greenGlow)"/>
    <path class="iconStroke" d="M-18 14l14-30 14 21 8-13"/>
    <path class="iconStroke" d="M-18 14h36"/>
    <text class="label body" x="0" y="66" text-anchor="middle">Predicted ED Risk</text>
    <text class="label body" x="0" y="89" text-anchor="middle">With vs Without</text>
  </g>
  <line class="dash" x1="652" y1="118" x2="768" y2="118"/>
  <g transform="translate(820 118)">
    <circle cx="0" cy="0" r="38" fill="#061006" stroke="#8cff00" stroke-width="2" filter="url(#greenGlow)"/>
    <text class="green" x="0" y="7" font-size="28" font-weight="800" text-anchor="middle">Δ</text>
    <text class="label body" x="0" y="66" text-anchor="middle">Benefit Score</text>
    <text class="label body" x="0" y="89" text-anchor="middle">Control - Treated</text>
  </g>
  <line class="dash" x1="884" y1="118" x2="1000" y2="118"/>
  <g transform="translate(1052 118)">
    <circle cx="0" cy="0" r="38" fill="#061006" stroke="#8cff00" stroke-width="2" filter="url(#greenGlow)"/>
    <path class="iconStroke" d="M-17 -12h34M-17 0h24M-17 12h30"/>
    <text class="label body" x="0" y="66" text-anchor="middle">SHAP &amp; Drivers</text>
    <text class="label body" x="0" y="89" text-anchor="middle">Local Explanation</text>
  </g>

  <line x1="1130" y1="53" x2="1130" y2="219" stroke="#aeb8b0" stroke-width="1.2"/>
  <rect class="panel2" x="1170" y="30" width="376" height="208" rx="10"/>
  <text class="purple h2" x="1240" y="61">ACTION LAYER</text>
  <text class="label small" x="1240" y="87">Turns uplift estimates into transparent next steps</text>
  <g transform="translate(1196 96)">
    <rect x="0" y="0" width="40" height="40" rx="7" fill="#110014" stroke="#dc4cff"/>
    <path d="M12 25l7-13 7 13M15 21h8" stroke="#dc4cff" fill="none" stroke-width="2"/>
    <text class="label small" x="58" y="16">Ranks highest expected-benefit members</text>
    <text class="label small" x="58" y="35">before outreach resources are assigned</text>
  </g>
  <g transform="translate(1196 149)">
    <rect x="0" y="0" width="40" height="40" rx="7" fill="#110014" stroke="#dc4cff"/>
    <path d="M12 28h16M12 12h16M12 20h10" stroke="#dc4cff" fill="none" stroke-width="2"/>
    <text class="label small" x="58" y="16">Explains feature drivers in clinician-friendly</text>
    <text class="label small" x="58" y="35">language for review and case planning</text>
  </g>

  <!-- Middle row -->
  <rect class="panel" x="18" y="268" width="270" height="382" rx="8"/>
  <text class="green h2" x="78" y="303">INPUTS</text>
  <g transform="translate(34 302)">
    <circle class="iconStroke" cx="12" cy="-10" r="8"/><path class="iconStroke" d="M0 12c3-14 21-14 24 0"/>
  </g>
  <g class="label body">
    <rect x="39" y="332" width="37" height="37" rx="5" fill="#050805" stroke="#8cff00"/><text x="92" y="357">Member demographics</text>
    <rect x="39" y="388" width="37" height="37" rx="5" fill="#050805" stroke="#8cff00"/><text x="92" y="413">Clinical conditions</text>
    <rect x="39" y="444" width="37" height="37" rx="5" fill="#050805" stroke="#8cff00"/><text x="92" y="469">Prior utilization</text>
    <rect x="39" y="500" width="37" height="37" rx="5" fill="#050805" stroke="#8cff00"/><text x="92" y="525">Pharmacy &amp; cost</text>
    <rect x="39" y="556" width="37" height="37" rx="5" fill="#050805" stroke="#8cff00"/><text x="92" y="581">SDOH / access flags</text>
  </g>
  <g class="line">
    <line x1="39" y1="375" x2="262" y2="375"/><line x1="39" y1="431" x2="262" y2="431"/><line x1="39" y1="487" x2="262" y2="487"/><line x1="39" y1="543" x2="262" y2="543"/>
  </g>

  <rect class="panel" x="300" y="268" width="282" height="382" rx="8"/>
  <text class="green h2" x="376" y="303">SCORING FLOW</text>
  <path class="iconStroke" d="M334 285a16 16 0 1 0 1 0M334 276v-12M334 306v12M314 296h-12M366 296h-12"/>
  <line x1="346" y1="345" x2="346" y2="600" stroke="#14ff22" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#020504">
    <circle cx="346" cy="345" r="17" fill="#14ff22"/><text x="346" y="350" text-anchor="middle">01</text>
    <circle cx="346" cy="408" r="17" fill="#14ff22"/><text x="346" y="413" text-anchor="middle">02</text>
    <circle cx="346" cy="471" r="17" fill="#14ff22"/><text x="346" y="476" text-anchor="middle">03</text>
    <circle cx="346" cy="534" r="17" fill="#14ff22"/><text x="346" y="539" text-anchor="middle">04</text>
    <circle cx="346" cy="597" r="17" fill="#14ff22"/><text x="346" y="602" text-anchor="middle">05</text>
  </g>
  <g class="label body">
    <text x="379" y="348">Predict ED risk if treated</text>
    <text class="muted small" x="379" y="369">Program exposure path</text>
    <text x="379" y="411">Predict ED risk if untreated</text>
    <text class="muted small" x="379" y="432">Counterfactual comparison</text>
    <text x="379" y="474">Calculate benefit score</text>
    <text class="muted small" x="379" y="495">Control risk minus treated risk</text>
    <text x="379" y="537">Assign uplift decile</text>
    <text class="muted small" x="379" y="558">Focus on highest benefit</text>
    <text x="379" y="600">Generate explanation</text>
    <text class="muted small" x="379" y="621">Risk + benefit driver views</text>
  </g>

  <rect class="panel" x="594" y="268" width="586" height="382" rx="8"/>
  <text class="green h2" x="664" y="303">MEMBER PRIORITIZATION</text>
  <path class="iconStroke" d="M625 300h25M625 292v8M637 282v18M649 288v12"/>
  <text class="muted small" x="1007" y="306">Illustrative top-candidate view</text>
  <line class="grid" x1="624" y1="340" x2="1148" y2="340"/>
  <text class="muted tiny" x="644" y="328">Member</text>
  <text class="muted tiny" x="792" y="328">Risk if treated</text>
  <text class="muted tiny" x="926" y="328">Risk if untreated</text>
  <text class="muted tiny" x="1080" y="328">Benefit</text>
  <g class="label small">
    <text x="644" y="369">M-1042</text><text x="806" y="369">0.18</text><text x="944" y="369">0.31</text><text class="green" x="1085" y="369">+0.13</text>
    <text x="644" y="413">M-0837</text><text x="806" y="413">0.14</text><text x="944" y="413">0.25</text><text class="green" x="1085" y="413">+0.11</text>
    <text x="644" y="457">M-2190</text><text x="806" y="457">0.22</text><text x="944" y="457">0.31</text><text class="green" x="1085" y="457">+0.09</text>
    <text x="644" y="501">M-1764</text><text x="806" y="501">0.09</text><text x="944" y="501">0.16</text><text class="green" x="1085" y="501">+0.07</text>
  </g>
  <g>
    <rect x="746" y="353" width="86" height="18" fill="#113016"/><rect x="746" y="353" width="54" height="18" fill="#14ff22"/>
    <rect x="884" y="353" width="122" height="18" fill="#113016"/><rect x="884" y="353" width="94" height="18" fill="#14ff22"/>
    <rect x="746" y="397" width="86" height="18" fill="#113016"/><rect x="746" y="397" width="42" height="18" fill="#14ff22"/>
    <rect x="884" y="397" width="122" height="18" fill="#113016"/><rect x="884" y="397" width="75" height="18" fill="#14ff22"/>
    <rect x="746" y="441" width="86" height="18" fill="#113016"/><rect x="746" y="441" width="66" height="18" fill="#14ff22"/>
    <rect x="884" y="441" width="122" height="18" fill="#113016"/><rect x="884" y="441" width="94" height="18" fill="#14ff22"/>
    <rect x="746" y="485" width="86" height="18" fill="#113016"/><rect x="746" y="485" width="27" height="18" fill="#14ff22"/>
    <rect x="884" y="485" width="122" height="18" fill="#113016"/><rect x="884" y="485" width="48" height="18" fill="#14ff22"/>
  </g>
  <g class="grid">
    <line x1="624" y1="384" x2="1148" y2="384"/><line x1="624" y1="428" x2="1148" y2="428"/><line x1="624" y1="472" x2="1148" y2="472"/><line x1="624" y1="516" x2="1148" y2="516"/>
  </g>
  <text class="green h3" x="640" y="558">Top Benefit Decile</text>
  <text class="label" x="640" y="592" font-size="46" font-weight="800">30</text>
  <text class="muted small" x="710" y="580">members</text>
  <text class="muted small" x="710" y="602">prioritized for review</text>
  <text class="green h3" x="880" y="558">Avg Predicted Benefit</text>
  <text class="label" x="880" y="592" font-size="46" font-weight="800">8.3%</text>
  <text class="muted small" x="984" y="580">GLMNet</text>
  <text class="muted small" x="984" y="602">candidate model view</text>
  <text class="amber h3" x="640" y="630">Decision note: validate observed gap and ROI before production deployment.</text>

  <rect class="panel" x="1192" y="268" width="390" height="382" rx="8"/>
  <text class="green h2" x="1230" y="303">MODEL COMPARISON</text>
  <text class="label body" x="1230" y="345">XGBoost T-Learner</text>
  <text class="muted small" x="1230" y="371">Test AUC avg: 0.709</text>
  <text class="muted small" x="1230" y="395">Top decile benefit: 4.8%</text>
  <rect x="1230" y="414" width="300" height="14" fill="#123016"/><rect x="1230" y="414" width="145" height="14" fill="#14ff22"/>
  <text class="label body" x="1230" y="470">GLMNet / Elastic Net</text>
  <text class="muted small" x="1230" y="496">Test AUC avg: 0.782</text>
  <text class="muted small" x="1230" y="520">Top decile benefit: 8.3%</text>
  <rect x="1230" y="539" width="300" height="14" fill="#123016"/><rect x="1230" y="539" width="250" height="14" fill="#14ff22"/>
  <text class="green h3" x="1230" y="595">Recommended dashboard stance</text>
  <text class="label small" x="1230" y="622">Use model comparison as a governance view:</text>
  <text class="label small" x="1230" y="646">risk ranking, calibration, benefit ranking,</text>
  <text class="label small" x="1230" y="670">explainability, and ROI support together.</text>

  <!-- Bottom row -->
  <rect class="panel" x="18" y="662" width="424" height="220" rx="8"/>
  <text class="green h2" x="78" y="697">LOCAL MEMBER EXPLANATION</text>
  <path class="iconStroke" d="M46 692c0-12 18-18 26-7 8 11-4 24-14 29v13h-16v-13c-7-4-13-12-13-22"/>
  <text class="label body" x="36" y="730">Member M-1042 is prioritized because the model</text>
  <text class="label body" x="36" y="756">expects intervention to lower 90-day ED risk from</text>
  <text class="label body" x="36" y="782">31% to 18%, an estimated 13-point benefit.</text>
  <text class="muted small" x="36" y="819">Primary drivers: recent ED utilization, high current</text>
  <text class="muted small" x="36" y="841">risk score, CHF/COPD flags, and transportation barrier.</text>

  <rect class="panel" x="454" y="662" width="430" height="220" rx="8"/>
  <text class="muted small" x="494" y="696">BENEFIT SCORE</text>
  <text class="label" x="494" y="753" font-size="66" font-weight="800">+0.13</text>
  <text class="green small" x="626" y="732">Predicted reduction</text>
  <text class="green small" x="626" y="754">in ED event likelihood</text>
  <circle cx="785" cy="753" r="52" fill="none" stroke="#133016" stroke-width="16"/>
  <circle cx="785" cy="753" r="52" fill="none" stroke="url(#riskArc)" stroke-width="16" stroke-dasharray="240 90" transform="rotate(-90 785 753)"/>
  <text class="label" x="785" y="762" text-anchor="middle" font-size="28" font-weight="800">1</text>
  <text class="muted tiny" x="785" y="800" text-anchor="middle">uplift decile</text>
  <line x1="666" y1="672" x2="666" y2="872" stroke="#aeb8b0" stroke-width="1"/>
  <text class="green h3" x="494" y="810">Top positive benefit drivers</text>
  <text class="label small" x="494" y="840">Current risk score</text><text class="green small" x="620" y="840">+0.041</text>
  <text class="label small" x="494" y="864">ED visits last 6m</text><text class="green small" x="620" y="864">+0.032</text>
  <text class="label small" x="700" y="840">Transportation barrier</text><text class="green small" x="842" y="840">+0.018</text>
  <text class="label small" x="700" y="864">CHF / COPD flags</text><text class="green small" x="842" y="864">+0.014</text>

  <rect class="panel" x="896" y="662" width="686" height="220" rx="8"/>
  <text class="green h2" x="958" y="697">BUSINESS IMPACT</text>
  <path class="iconStroke" d="M927 700a28 28 0 1 1 21-8M927 700l28-30M936 682h22v22"/>
  <g class="label body">
    <circle cx="928" cy="735" r="13" fill="none" stroke="#8cff00" stroke-width="2"/><path d="M921 735l5 6 10-13" stroke="#8cff00" fill="none" stroke-width="2"/><text x="956" y="741">Prioritize members by likely intervention benefit, not risk alone</text>
    <circle cx="928" cy="778" r="13" fill="none" stroke="#8cff00" stroke-width="2"/><path d="M921 778l5 6 10-13" stroke="#8cff00" fill="none" stroke-width="2"/><text x="956" y="784">Use calibration and observed-gap views as model readiness checks</text>
    <circle cx="928" cy="821" r="13" fill="none" stroke="#8cff00" stroke-width="2"/><path d="M921 821l5 6 10-13" stroke="#8cff00" fill="none" stroke-width="2"/><text x="956" y="827">Show why each recommendation is made before outreach</text>
    <circle cx="928" cy="864" r="13" fill="none" stroke="#8cff00" stroke-width="2"/><path d="M921 864l5 6 10-13" stroke="#8cff00" fill="none" stroke-width="2"/><text x="956" y="870">Track estimated ED visits avoided, net savings, and ROI assumptions</text>
  </g>
</svg>
